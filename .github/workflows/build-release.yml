name: (selfhost dev build)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'architecture'
        required: true
        default: 'arm64'
        type: choice
        options: [arm64, arm]
      chromium_source:
        description: 'chromium source'
        required: true
        default: 'github'
        type: choice
        options: ['github', 'googlesource']
      release_name:
        description: 'release tag (blank = no release)'
        required: false
        default: ''
        type: string
      resume:
        description: 'resume build'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          clean: false

      - name: Resolve version
        run: |
          . ./.build_config
          echo "VERSION=${chromium_version}-${ungoogled_chromium_android_revision}" >> "$GITHUB_ENV"

      - name: Stage keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            chmod 700 "$RUNNER_TEMP/ks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
            printf '%s' "$KEYSTORE_PASS" > "$RUNNER_TEMP/ks/pass"
            chmod 600 "$RUNNER_TEMP/ks"/*
            echo "UGC_KEYSTORE=$RUNNER_TEMP/ks/release.jks"   >> "$GITHUB_ENV"
            echo "UGC_KEYSTORE_PASSFILE=$RUNNER_TEMP/ks/pass" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          CHROMIUM_SOURCE: ${{ inputs.chromium_source == 'github' && 'https://github.com/chromium/chromium.git' || 'https://chromium.googlesource.com/chromium/src.git' }}
        run: ./build.sh ${{ inputs.resume == 'yes' && '--resume' || '' }} --arch "${{ inputs.architecture }}" --target chrome_modern_target

      - name: Sign and assemble
        run: build/release.sh "${{ inputs.architecture }}"

      - name: Attest build provenance
        if: ${{ inputs.resume == 'no' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            releases/${{ env.VERSION }}/ChromePublic_${{ inputs.architecture }}.apk
            releases/${{ env.VERSION }}/ChromePublic_${{ inputs.architecture }}.aab

      - name: Create release
        if: ${{ inputs.release_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_name }}
          ARCH: ${{ inputs.architecture }}
        run: |
          REL="releases/${VERSION}"
          files=("$REL/ChromePublic_${ARCH}.apk")
          [ "$ARCH" = arm64 ] && files+=("$REL/ChromePublic_arm64.aab")
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "FATAL: missing $f"; exit 1; }; done
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          body="Please see [CHANGELOG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for latest updates."
          rid=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -X POST "$api/releases"                   -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"$body\"}"                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null)             || rid=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "$api/releases/tags/$TAG"                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          [ -n "$rid" ] || { echo "FATAL: could not create or find release $TAG"; exit 1; }
          for f in "${files[@]}"; do
              curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/octet-stream"                   --data-binary @"$f"                   "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?name=$(basename "$f")" >/dev/null
              echo "uploaded $(basename "$f") to $TAG"
          done

      - name: Remove staged keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks"
